<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Exercise Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden-view { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <div id="login-view" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
            <h1 class="text-2xl font-bold text-center mb-6 text-indigo-600">운동 기록 로그인</h1>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="아이디" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                <input type="password" id="password" placeholder="비밀번호" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">로그인</button>
            </div>
            <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        </div>
    </div>

    <div id="dashboard-view" class="hidden-view max-w-2xl mx-auto p-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">나의 운동 일지</h2>
            <button onclick="handleLogout()" class="text-sm text-gray-500 hover:text-red-600 underline">로그아웃</button>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-8">
            <h3 class="font-semibold mb-4 text-lg">오늘의 운동 기록</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="date" id="date-input" class="p-3 border rounded-lg w-full">
                <select id="exercise-select" class="p-3 border rounded-lg w-full">
                    <option value="팔굽혀펴기 50회">팔굽혀펴기 50회</option>
                    <option value="계단오르기">계단오르기</option>
                    <option value="러닝 5km">러닝 5km</option>
                    <option value="스쿼트 50회">스쿼트 50회</option>
                </select>
                <button onclick="addExercise()" class="col-span-1 md:col-span-2 bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">기록 저장</button>
            </div>
        </div>

        <!-- Filter & List Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-semibold text-lg">운동 기록 목록</h3>
                <input type="month" id="month-filter" onchange="renderExercises()" class="p-2 border rounded-lg text-sm">
            </div>
            <div id="exercise-list" class="space-y-3">
                <!-- Records injected here -->
            </div>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let records = JSON.parse(localStorage.getItem('exercise_logs')) || [];

        // Initial Setup
        document.getElementById('date-input').valueAsDate = new Date();
        document.getElementById('month-filter').value = new Date().toISOString().slice(0, 7);

        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');

            if (user === 'user' && pass === 'userpass') {
                isLoggedIn = true;
                document.getElementById('login-view').classList.add('hidden-view');
                document.getElementById('dashboard-view').classList.remove('hidden-view');
                renderExercises();
            } else {
                errorMsg.classList.remove('hidden-view');
            }
        }

        function handleLogout() {
            isLoggedIn = false;
            document.getElementById('login-view').classList.remove('hidden-view');
            document.getElementById('dashboard-view').classList.add('hidden-view');
        }

        function addExercise() {
            const date = document.getElementById('date-input').value;
            const exercise = document.getElementById('exercise-select').value;
            
            if (!date) return;

            records.push({ id: Date.now(), date, exercise });
            localStorage.setItem('exercise_logs', JSON.stringify(records));
            renderExercises();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            localStorage.setItem('exercise_logs', JSON.stringify(records));
            renderExercises();
        }

        function renderExercises() {
            const listEl = document.getElementById('exercise-list');
            const filterMonth = document.getElementById('month-filter').value;
            
            const filtered = records.filter(r => r.date.startsWith(filterMonth))
                                    .sort((a,b) => new Date(b.date) - new Date(a.date));

            listEl.innerHTML = filtered.length ? '' : '<p class="text-gray-400 text-center py-4">기록된 운동이 없습니다.</p>';

            filtered.forEach(r => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-4 bg-gray-50 rounded-lg border';
                div.innerHTML = `
                    <div>
                        <p class="font-medium">${r.exercise}</p>
                        <p class="text-xs text-gray-500">${r.date}</p>
                    </div>
                    <button onclick="deleteRecord(${r.id})" class="text-red-400 hover:text-red-600 text-sm">삭제</button>
                `;
                listEl.appendChild(div);
            });
        }
    </script>
</body>
</html>
